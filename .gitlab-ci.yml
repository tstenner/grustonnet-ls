stages:
  - test
  - build
  - release
  - publish

test:
  image: rust:latest
  stage: test
  variables:
    GOBIN: "/usr/bin"
  before_script:
    - apt-get update && apt-get -y install clang golang
    - go install github.com/google/go-jsonnet/cmd/jsonnet@latest
    - rustup toolchain install nightly
    - rustup default nightly
    - cargo install --root . cargo2junit
  script:
    - cargo test -- -Z unstable-options --format json --report-time | bin/cargo2junit > report.xml
  artifacts:
    when: always
    reports:
      junit:
        - report.xml

build:linux:
  stage: build
  image: rust:latest
  artifacts:
    paths:
      - target/release/grustonnet-ls
  variables:
    GOBIN: "/usr/bin"
  before_script:
    - apt-get update && apt-get -y install clang golang
    - go install github.com/google/go-jsonnet/cmd/jsonnet@latest
  script:
    - cargo build --release

build:windows:
  stage: build
  image: rust:latest
  artifacts:
    paths:
      - target/x86_64-pc-windows-gnu/release/grustonnet-ls.exe
  variables:
    GOBIN: "/usr/bin"
  before_script:
    - apt-get update && apt-get -y install clang golang gcc-mingw-w64
    - go install github.com/google/go-jsonnet/cmd/jsonnet@latest
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cargo build --release --target x86_64-pc-windows-gnu

release:intellij:
  stage: release
  image: rust:latest
  dependencies:
    - build:linux
  artifacts:
    paths:
      - lsp4ij.tar.gz
  variables:
    GOBIN: "/usr/bin"
  before_script:
    - apt-get update && apt-get -y install golang
    - go install github.com/google/go-jsonnet/cmd/jsonnet@latest
  script:
    - pwd
    - ls *
    - ./target/release/grustonnet-ls --export-config-schema > ./editors/intellij/settings.schema.json
    - mkdir out && jsonnet -m out ./editors/intellij/template.jsonnet
    - tar cfz lsp4ij.tar.gz -C out .

rustdoc:
  stage: build
  image: rust
  variables:
    GOBIN: "/usr/bin"
  before_script:
    - apt-get update && apt-get -y install clang golang
    - go install github.com/google/go-jsonnet/cmd/jsonnet@latest
  script:
    - cargo doc --no-deps
  artifacts:
    paths:
      - target/doc
  only:
    - main

pages:
  stage: publish
  image: alpine
  dependencies:
    - rustdoc
  script:
    - mkdir -p public
    - mv target/doc public/doc
  artifacts:
    paths:
      - public
  only:
    - main
