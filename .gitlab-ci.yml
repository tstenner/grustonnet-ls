stages:
  - test
  - build
  - editors
  - doc
  - release
  - publish
variables:
  GITLAB_HOST: gitlab.ppidev.net
  RELEASE_TOKEN: $RELEASE_TOKEN
  GLAB_SEND_TELEMETRY: false
  GODEBUG: "invalidptr=0,cgocheck=0"
  KUBERNETES_CPU_REQUEST: "1"
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "8Gi"
  KUBERNETES_MEMORY_REQUEST: "6Gi"

test:
  image: rust:latest
  stage: test
  variables:
    GOBIN: "/usr/bin"
  before_script:
    - apt-get update && apt-get -y install clang golang
    - go install github.com/google/go-jsonnet/cmd/jsonnet@latest
    - rustup toolchain install nightly
    - rustup default nightly
    - cargo install --root . cargo2junit
  script:
    - cargo test -- -Z unstable-options --format json --report-time | bin/cargo2junit > report.xml
  artifacts:
    when: always
    reports:
      junit:
        - report.xml

build:linux:
  stage: build
  image: rust:latest
  artifacts:
    paths:
      - target/release/grustonnet-ls
  variables:
    GOBIN: "/usr/bin"
  before_script:
    - apt-get update && apt-get -y install clang golang
    - go install github.com/google/go-jsonnet/cmd/jsonnet@latest
  script:
    - cargo build --release

build:windows:
  stage: build
  image: rust:latest
  artifacts:
    paths:
      - target/x86_64-pc-windows-gnu/release/grustonnet-ls.exe
  variables:
    GOBIN: "/usr/bin"
  before_script:
    - apt-get update && apt-get -y install clang golang gcc-mingw-w64
    - go install github.com/google/go-jsonnet/cmd/jsonnet@latest
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cargo build --release --target x86_64-pc-windows-gnu

editors:vscodium:
  stage: editors
  image: node
  artifacts:
    paths:
      - editors/vscodium/plugin/grustonnet.vsix
  script:
    - pushd editors/vscodium/plugin
    - npm install -g @vscode/vsce
    - npm i
    - npm run compile
    - vsce package -o grustonnet.vsix

editors:intellij:
  stage: editors
  image: rust:latest
  dependencies:
    - "build:linux"
  artifacts:
    paths:
      - lsp4ij.tar.gz
  variables:
    GOBIN: "/usr/bin"
    KUBERNETES_CPU_REQUEST: "100m"
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
  before_script:
    - apt-get update && apt-get -y install golang
    - go install github.com/google/go-jsonnet/cmd/jsonnet@latest
  script:
    - ./target/release/grustonnet-ls --export-config-schema > ./editors/intellij/settings.schema.json
    - mkdir out && jsonnet -m out ./editors/intellij/template.jsonnet
    - tar cfz lsp4ij.tar.gz -C out .

rustdoc:
  stage: doc
  image: rust
  variables:
    GOBIN: "/usr/bin"
    KUBERNETES_CPU_REQUEST: "100m"
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
  before_script:
    - apt-get update && apt-get -y install clang golang
    - go install github.com/google/go-jsonnet/cmd/jsonnet@latest
  script:
    - cargo doc --no-deps
  artifacts:
    paths:
      - target/doc
  only:
    - main

changelog:
  image:
    name: orhunp/git-cliff:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  dependencies: []
  variables:
    GIT_STRATEGY: clone # clone entire repo instead of reusing workspace
    GIT_DEPTH: 0 # avoid shallow clone to give cliff all the info it needs
  stage: doc
  script:
    - git-cliff -r . --current > CHANGELOG.md
  artifacts:
    paths:
      - CHANGELOG.md

release_job:
  stage: release
  image: gitlab/glab:latest
  variables:
    KUBERNETES_CPU_REQUEST: "100m"
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - glab auth login --token ${RELEASE_TOKEN} --hostname ${GITLAB_HOST}
    - glab release create ${CI_COMMIT_TAG} -F CHANGELOG.md
    - tar cfz grustonnet_ls_windows_amd64.tar.gz -C target/x86_64-pc-windows-gnu/release . && glab release upload ${CI_COMMIT_TAG} grustonnet_ls_windows_amd64.tar.gz
    - tar cfz grustonnet_ls_linux_amd64.tar.gz -C target/release . &&  glab release upload ${CI_COMMIT_TAG} grustonnet_ls_linux_amd64.tar.gz
    - glab release upload ${CI_COMMIT_TAG} lsp4ij.tar.gz
    - glab release upload ${CI_COMMIT_TAG} editors/vscodium/plugin/grustonnet.vsix

pages:
  stage: publish
  image: alpine
  dependencies:
    - rustdoc
  variables:
    KUBERNETES_CPU_REQUEST: "100m"
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
  script:
    - mkdir -p public
    - mv target/doc public/doc
  artifacts:
    paths:
      - public
  only:
    - main
