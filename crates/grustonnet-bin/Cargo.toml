[package]
name = "grustonnet-bin"
version = "0.1.0"
edition.workspace = true
default-run = "grustonnet-ls"

[lints]
workspace = true

[features]
tracing = ["tracy-client", "grustonnet-ls-lib/tracing"]

[dependencies]
tokio.workspace=true
env_logger = "0.11.8"
grustonnet-ls-lib = { path = "../grustonnet-ls-lib"}
grustonnet-config = { path = "../grustonnet-config"}
language-server = { path = "../language-server"}
rust2go-env = { path = "../rust2go-env"}
schemars = "1.0.1"
clap = { version = "4.5.40", features = ["derive"] }
serde_json.workspace = true
tracy-client = { version = "0.18.2", optional = true }
[target.'cfg(unix)'.dependencies]
exec = { version = "0.3.1" }

[[bin]]
name = "grustonnet-ls"
path = "src/main.rs"
