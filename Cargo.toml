[workspace.package]
version = "0.2.0"
edition = "2024"

[profile.release]
strip = true
lto = true

[workspace.lints.clippy]
uninlined_format_args = "allow"
needless_update = "allow"
unwrap_used = "warn"
allow-unwrap-in-tests = "allow"

[workspace.lints.rust]
missing_docs = "allow"

[workspace]
members = [
"crates/grustonnet-bin",
"crates/grustonnet-lint",
"crates/grustonnet-ls-lib",
"crates/jsonnet-bridge",
"crates/jsonnet-location",
"crates/language-server",
"crates/test-macros",
"crates/utils",
]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
tree-sitter = { version = "0.25" }
